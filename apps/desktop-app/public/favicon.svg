<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- An open "O" with a wire leaving through the gap: Open + Wire.
       Gold and magenta are the incoming and outgoing chart colours. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#1c1c1c"/>
    </linearGradient>
    <linearGradient id="ring" x1="200" y1="200" x2="824" y2="824" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f3c900"/>
      <stop offset="1" stop-color="#d7397f"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M718.5 350.7 A262 262 0 1 0 718.5 673.3" stroke="url(#ring)" stroke-width="104"/>
    <path d="M512 512 H836" stroke="#d7397f" stroke-width="88"/>
  </g>
  <circle cx="512" cy="512" r="78" fill="#f3c900"/>
</svg>
