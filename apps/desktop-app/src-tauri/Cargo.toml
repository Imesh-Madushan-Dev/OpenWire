[package]
name = "app"
version = "0.1.0"
description = "Maizy VPN desktop client"
authors = ["Maizy"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
thiserror = "2"

tokio = { version = "1", features = [
  "rt-multi-thread",
  "net",
  "io-util",
  "time",
  "sync",
  "macros",
] }
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
  "logging",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
  "ring",
  "tls12",
] }
rustls-pki-types = "1"
webpki-roots = "1"
uuid = { version = "1", features = ["serde", "v4"] }
# Already in the tree via tauri's icon handling; direct deps cost no download.
png = "0.18"
base64 = "0.22"
# Trojan's password digest. Already in the tree via tauri.
sha2 = "0.10"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
maxminddb = "0.32.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_Threading", "Win32_System_Time", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Etw", "Win32_System_Services", "Win32_System_Pipes", "Win32_System_Registry", "Win32_Security", "Win32_Security_Authorization", "Win32_System_DataExchange", "Win32_System_Memory"] }
winreg = "0.55"
# WinRT per-app network usage (SRUM). Already in the tree via tauri.
windows = { version = "0.61", features = ["Networking_Connectivity", "Foundation"] }
windows-core = "0.61"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
